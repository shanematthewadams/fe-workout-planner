name: Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify desktop, tablet and mobile
        run: npm run test:browser
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            qa/
            playwright-report/
            test-results/
          retention-days: 14
