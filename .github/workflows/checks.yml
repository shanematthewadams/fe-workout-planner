name: Checks
on:
  push:
    branches: [main, studio/ux-streamline]
  workflow_dispatch:
  pull_request:
    branches: [main]
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --maxWorkers=1
      - run: npm run build
        env:
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/studio/ux-streamline' && 'staging' || 'production' }}
      - name: Build isolated cloud test app
        run: npx vite build --outDir qa/cloud-app
        env:
          VITE_APP_ENV: staging
          VITE_STAGING_SUPABASE_URL: https://staging-sync.invalid
          VITE_STAGING_SUPABASE_PUBLISHABLE_KEY: test-public-fixture
          VITE_STAGING_SYNC_RPC: fe_staging_sync_plans
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify desktop, tablet and mobile
        run: npm run test:browser
        env:
          CI: true
          FE_CLOUD_TEST_DIR: qa/cloud-app
          FE_STAGING_TEST: ${{ github.ref == 'refs/heads/studio/ux-streamline' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: |
            qa/
            playwright-report/
            test-results/
          retention-days: 14
